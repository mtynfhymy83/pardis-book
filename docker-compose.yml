services:
  app:
    build: .
    ports: ["9502:9502"]
    env_file: [.env]
    volumes: ["./:/app"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: .
    command: ["php", "scripts/worker.php"]
    env_file: [.env]
    volumes: ["./:/app"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: pardis, POSTGRES_USER: pardis, POSTGRES_PASSWORD: pardis }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pardis"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
volumes: { pgdata: {} }
