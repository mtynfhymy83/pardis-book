openapi: 3.1.0
info: {title: Pardis Book API, version: 0.1.0}
servers: [{url: /api/v1}]
tags:
  - name: product
    description: پرفروش‌های دستی؛ نمایش و جست‌وجوی عمومی و مدیریت توسط ادمین
  - name: Phase 0 / Platform
    description: سلامت سرویس، آمادگی وابستگی‌ها و قرارداد اولیه کلاینت
  - name: Home
    description: APIهای مورد استفاده صفحه اصلی، ناوبری، جست‌وجوی سریع و سبد مهمان
  - name: Phase 1 / Home
    description: داده‌های Cacheable صفحه اصلی و ناوبری عمومی
  - name: Phase 1 / Catalog
    description: کاتالوگ، مجموعه، Taxonomy و Facetهای عمومی
  - name: Phase 1 / Search
    description: جست‌وجوی کامل و پیشنهاد زنده
  - name: Phase 1 / Pricing
    description: قیمت پلکانی و کنترل هم‌زمان موجودی
  - name: Phase 2 / Auth
    description: OTP مشتریان، ورود نام کاربری/رمز عبور مدیران، نشست‌ها و خروج امن
  - name: Phase 2 / Account
    description: پروفایل و اطلاعات تجاری کاربر
  - name: Phase 2 / Addresses
    description: نشانی‌های نسخه‌دار کاربر
  - name: Phase 2 / Cart
    description: سبد نسخه‌دار مهمان و کاربر
  - name: Phase 2 / Coupon
    description: اعمال و حذف کد تخفیف از سبد
  - name: Phase 3 / Payment
    description: تلاش پرداخت، بازگشت و وب‌هوک تأییدشده
  - name: Phase 3 / Orders
    description: عملیات سفارش، فاکتور و مرسوله
  - name: Phase 4 / Support
    description: تیکت‌های مشتری و مکاتبات پشتیبانی
  - name: Phase 4 / Admin Operations
    description: عملیات سفارش، پرداخت، ارسال و مشتریان پنل مدیریت
  - name: Phase 4 / Reports
    description: گزارش‌های عملیاتی محافظت‌شده پنل مدیریت
  - name: Phase 4 / Catalog Admin
    description: مدیریت محصول، قیمت‌گذاری و موجودی
  - name: Phase 4 / Configuration
    description: کوپن‌ها و تنظیمات فروشگاه پنل مدیریت
  - name: Phase 5 / Hardening
    description: محدودسازی نرخ و حفاظت عملیاتی مسیرهای حساس
security: [{bearerAuth: []}]
paths:
  /health/live:
    get:
      tags: [Phase 0 / Platform]
      operationId: platformLiveness
      summary: بررسی زنده‌بودن پردازش API
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '200': {$ref: '#/components/responses/HealthLiveSuccess'}
  /health/ready:
    get:
      tags: [Phase 0 / Platform]
      operationId: platformReadiness
      summary: بررسی آمادگی API و اتصال دیتابیس
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '200': {$ref: '#/components/responses/HealthReadySuccess'}
        '503': {$ref: '#/components/responses/Error'}
  /bootstrap:
    get:
      tags: [Phase 0 / Platform]
      operationId: platformBootstrap
      summary: تنظیمات اولیه برنامه
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '200': {$ref: '#/components/responses/BootstrapSuccess'}
  /home:
    get:
      tags: [Phase 1 / Home]
      summary: داده تجمیعی صفحه اصلی
      security: []
      responses:
        '200': {$ref: '#/components/responses/HomeSuccess'}
  /navigation:
    get:
      tags: [Phase 1 / Home]
      summary: منوی اصلی و درخت دسته‌بندی‌ها
      security: []
      responses:
        '200': {$ref: '#/components/responses/Success'}
  /auth/otp/request: {post: {tags: [Phase 2 / Auth, Phase 5 / Hardening], security: [], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}, '429': {$ref: '#/components/responses/Error'}}}}
  /auth/otp/verify: {post: {tags: [Phase 2 / Auth, Phase 5 / Hardening], security: [], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}}}
  /auth/admin/login:
    post:
      tags: [Phase 2 / Auth, Phase 5 / Hardening]
      operationId: adminPasswordLogin
      summary: ورود کارکنان پنل با نام کاربری و رمز عبور
      description: نشست صادرشده تا ۳۰ روز معتبر است و access token کوتاه‌عمر از طریق refresh token تمدید می‌شود.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, minLength: 3, maxLength: 100, pattern: '^[a-z0-9._-]+$', example: admin}
                password: {type: string, format: password, minLength: 1}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/token/refresh: {post: {tags: [Phase 2 / Auth], security: [], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /products:
    get:
      tags: [Phase 1 / Catalog]
      summary: فهرست محصولات قابل نمایش از صفحه اصلی
      security: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: q, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [newest, bestSelling, unitPriceAsc, fastDispatch]}}
      responses:
        '200': {$ref: '#/components/responses/ProductCollectionSuccess'}
  /products/best-selling:
    get:
      tags: [product]
      operationId: listBestSellingProducts
      summary: فهرست عمومی کتاب‌های پرفروش منتخب
      description: فقط آیتم‌های فعال را طبق ترتیب تعیین‌شده در پنل ادمین برمی‌گرداند.
      security: []
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/BestSellingCollectionSuccess'}
  /products/best-selling/search:
    get:
      tags: [product]
      operationId: searchBestSellingProducts
      summary: جست‌وجوی عمومی کتاب‌های پرفروش
      description: جست‌وجو فقط میان آیتم‌های فعال و بر اساس نام کتاب انجام می‌شود.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: بخشی از نام کتاب
          schema: {type: string, minLength: 2, example: فمیلی}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/BestSellingCollectionSuccess'}
        '422': {$ref: '#/components/responses/Error'}
  /products/fast-dispatch:
    get:
      tags: [Phase 1 / Home]
      summary: محصولات موجود و آماده ارسال سریع
      security: []
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/ProductCollectionSuccess'}
  /products/{productSlug}:
    get:
      tags: [Phase 1 / Catalog]
      summary: جزئیات محصول انتخاب‌شده از صفحه اصلی
      security: []
      parameters:
        - {name: productSlug, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/Error'}
  /products/{productSlug}/related:
    get:
      tags: [Phase 1 / Catalog]
      summary: محصولات مرتبط با محصول انتخاب‌شده
      security: []
      parameters:
        - {name: productSlug, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/ProductCollectionSuccess'}
        '404': {$ref: '#/components/responses/Error'}
  /series:
    get:
      tags: [Phase 1 / Catalog]
      summary: فهرست مجموعه‌های کتاب
      security: []
      responses:
        '200': {$ref: '#/components/responses/Success'}
  /series/featured:
    get:
      tags: [Phase 1 / Catalog]
      summary: مجموعه‌های منتخب صفحه اصلی
      security: []
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/Success'}
  /series/{seriesSlug}:
    get:
      tags: [Phase 1 / Catalog]
      summary: Landing مجموعه و محصولات آن
      security: []
      parameters:
        - {name: seriesSlug, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/Error'}
  /publishers:
    get:
      tags: [Phase 1 / Catalog]
      summary: ناشران کاتالوگ
      security: []
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /categories:
    get:
      tags: [Phase 1 / Catalog]
      summary: فهرست دسته‌بندی‌های کاتالوگ
      security: []
      responses:
        '200': {$ref: '#/components/responses/Success'}
  /catalog/facets:
    get:
      tags: [Phase 1 / Catalog]
      summary: مقادیر و شمارش Facetهای کاتالوگ
      security: []
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /content/pages/{slug}:
    get:
      tags: [Phase 1 / Home]
      summary: صفحه محتوای عمومی
      security: []
      parameters: [{name: slug, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/Error'}
  /search/suggestions:
    get:
      tags: [Phase 1 / Search]
      summary: پیشنهاد زنده محصول و مجموعه
      security: []
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
  /search:
    get:
      tags: [Phase 1 / Search]
      summary: نتایج کامل جست‌وجو
      security: []
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses: {'200': {$ref: '#/components/responses/ProductCollectionSuccess'}}
  /skus/{skuId}/pricing:
    get:
      tags: [Phase 1 / Pricing]
      summary: قیمت پلکانی SKU انتخاب‌شده
      security: []
      parameters:
        - {name: skuId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/Error'}
  /pricing/quote-line:
    post:
      tags: [Phase 1 / Pricing]
      summary: محاسبه قیمت یک SKU برای تعداد مشخص
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PricingQuoteLineRequest'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '409': {$ref: '#/components/responses/Error'}
  /availability/check:
    post:
      tags: [Phase 1 / Pricing]
      summary: کنترل هم‌زمان دسترس‌پذیری حداکثر ۵۰ SKU
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [skuId]
                    properties:
                      skuId: {type: string}
                      quantity: {type: integer, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '422': {$ref: '#/components/responses/Error'}
  /carts:
    post:
      tags: [Phase 2 / Cart]
      summary: ساخت سبد مهمان
      security: []
      responses:
        '201': {$ref: '#/components/responses/Success'}
  /cart:
    get:
      tags: [Phase 2 / Cart]
      summary: دریافت سبد جاری و شمارنده هدر
      security: []
      parameters:
        - {$ref: '#/components/parameters/GuestCartToken'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/Error'}
  /cart/items:
    post:
      tags: [Phase 2 / Cart]
      summary: افزودن SKU از کارت محصول به سبد
      security: []
      parameters:
        - {$ref: '#/components/parameters/GuestCartToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CartItemRequest'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /cart/validate:
    post:
      tags: [Phase 2 / Cart]
      summary: قیمت‌گذاری مجدد و اعتبارسنجی سبد جاری
      security: []
      parameters:
        - {$ref: '#/components/parameters/GuestCartToken'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/Error'}
  /checkout/quote: {post: {tags: [Phase 3 / Orders], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /orders: {get: {tags: [Phase 3 / Orders], responses: {'200': {$ref: '#/components/responses/Success'}}}, post: {tags: [Phase 3 / Orders], parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}}
  /payments/attempts: {post: {tags: [Phase 3 / Payment], parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}}
  /me:
    get: {tags: [Phase 2 / Account], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {tags: [Phase 2 / Account], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {tags: [Phase 2 / Account], responses: {'204': {$ref: '#/components/responses/Success'}}}
  /me/addresses:
    get: {tags: [Phase 2 / Addresses], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {tags: [Phase 2 / Addresses], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /auth/logout: {post: {tags: [Phase 2 / Auth], responses: {'204': {$ref: '#/components/responses/Success'}}}}
  /auth/logout-all: {post: {tags: [Phase 2 / Auth], responses: {'204': {$ref: '#/components/responses/Success'}}}}
  /auth/sessions:
    get: {tags: [Phase 2 / Auth], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /auth/sessions/{sessionId}:
    delete: {tags: [Phase 2 / Auth], parameters: [{name: sessionId, in: path, required: true, schema: {type: string}}], responses: {'204': {$ref: '#/components/responses/Success'}}}
  /me/business-profile:
    get: {tags: [Phase 2 / Account], responses: {'200': {$ref: '#/components/responses/Success'}}}
    put: {tags: [Phase 2 / Account], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /me/addresses/{addressId}:
    patch: {tags: [Phase 2 / Addresses], parameters: [{name: addressId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {tags: [Phase 2 / Addresses], parameters: [{name: addressId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'204': {$ref: '#/components/responses/Success'}}}
  /me/addresses/{addressId}/default:
    post: {tags: [Phase 2 / Addresses], parameters: [{name: addressId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /cart/items/{itemId}:
    patch: {tags: [Phase 2 / Cart], parameters: [{name: itemId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {tags: [Phase 2 / Cart], parameters: [{name: itemId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /cart/merge: {post: {tags: [Phase 2 / Cart], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /cart/coupon:
    post: {tags: [Phase 2 / Coupon], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {tags: [Phase 2 / Coupon], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /payments/attempts/{attemptId}:
    get: {tags: [Phase 3 / Payment], parameters: [{name: attemptId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /payments/attempts/{attemptId}/verify:
    post: {tags: [Phase 3 / Payment], parameters: [{name: attemptId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /orders/{orderId}:
    get: {tags: [Phase 3 / Orders], parameters: [{name: orderId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /orders/{orderId}/payment:
    get: {tags: [Phase 3 / Payment], parameters: [{name: orderId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /orders/{orderId}/timeline:
    get: {tags: [Phase 3 / Orders], parameters: [{name: orderId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /orders/{orderId}/invoice:
    get: {tags: [Phase 3 / Orders], parameters: [{name: orderId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /orders/{orderId}/shipments:
    get: {tags: [Phase 3 / Orders], parameters: [{name: orderId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /orders/{orderId}/cancel:
    post: {tags: [Phase 3 / Orders], parameters: [{name: orderId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /shipments/{shipmentId}/tracking:
    get: {tags: [Phase 3 / Orders], parameters: [{name: shipmentId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /payments/callback/{provider}:
    get: {tags: [Phase 3 / Payment], security: [], parameters: [{name: provider, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {tags: [Phase 3 / Payment], security: [], parameters: [{name: provider, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /webhooks/payments/{provider}:
    post: {tags: [Phase 3 / Payment], security: [], parameters: [{name: provider, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Error'}}}
  /support/categories:
    get: {tags: [Phase 4 / Support], security: [], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /support/tickets:
    get: {tags: [Phase 4 / Support], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {tags: [Phase 4 / Support, Phase 5 / Hardening], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}, '429': {$ref: '#/components/responses/Error'}}}
  /support/tickets/{ticketId}:
    get: {tags: [Phase 4 / Support], parameters: [{name: ticketId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /support/tickets/{ticketId}/messages:
    post: {tags: [Phase 4 / Support], parameters: [{name: ticketId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /support/tickets/{ticketId}/close:
    post: {tags: [Phase 4 / Support], parameters: [{name: ticketId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /support/uploads:
    post: {tags: [Phase 4 / Support], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /admin/orders:
    get: {tags: [Phase 4 / Admin Operations], responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}}
  /admin/orders/{orderId}/transitions:
    post: {tags: [Phase 4 / Admin Operations], parameters: [{name: orderId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/orders/{orderId}/notes:
    post: {tags: [Phase 4 / Admin Operations], parameters: [{name: orderId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /admin/orders/{orderId}/shipments:
    post: {tags: [Phase 4 / Admin Operations], parameters: [{name: orderId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /admin/shipments/{shipmentId}/dispatch:
    post: {tags: [Phase 4 / Admin Operations], parameters: [{name: shipmentId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/customers:
    get: {tags: [Phase 4 / Admin Operations], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/payments:
    get: {tags: [Phase 4 / Admin Operations], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/reports/sales-summary:
    get: {tags: [Phase 4 / Reports], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/reports/inventory-risk:
    get: {tags: [Phase 4 / Reports], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/reports/exports:
    post: {tags: [Phase 4 / Reports], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /admin/reports/exports/{jobId}:
    get: {tags: [Phase 4 / Reports], parameters: [{name: jobId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/tickets:
    get: {tags: [Phase 4 / Admin Operations], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/tickets/{ticketId}:
    get: {tags: [Phase 4 / Admin Operations], parameters: [{name: ticketId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/tickets/{ticketId}/messages:
    post: {tags: [Phase 4 / Admin Operations], parameters: [{name: ticketId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /admin/tickets/{ticketId}/assign:
    post: {tags: [Phase 4 / Admin Operations], parameters: [{name: ticketId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/tickets/{ticketId}/status:
    post: {tags: [Phase 4 / Admin Operations], parameters: [{name: ticketId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/products:
    get: {tags: [Phase 4 / Catalog Admin], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {tags: [Phase 4 / Catalog Admin], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /admin/products/{productId}:
    patch: {tags: [Phase 4 / Catalog Admin], parameters: [{name: productId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/products/{productId}/publish:
    post: {tags: [Phase 4 / Catalog Admin], parameters: [{name: productId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/products/{productId}/archive:
    post: {tags: [Phase 4 / Catalog Admin], parameters: [{name: productId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/best-selling-products:
    get:
      tags: [product]
      operationId: adminListBestSellingProducts
      summary: فهرست مدیریتی کتاب‌های پرفروش
      description: آیتم‌های فعال و غیرفعال را برمی‌گرداند و با نام کتاب قابل فیلتر است. نیازمند مجوز catalog.read است.
      parameters:
        - name: q
          in: query
          required: false
          description: فیلتر اختیاری بر اساس نام کتاب
          schema: {type: string, example: فمیلی}
      responses:
        '200': {$ref: '#/components/responses/AdminBestSellingCollectionSuccess'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [product]
      operationId: adminCreateBestSellingProduct
      summary: افزودن کتاب به پرفروش‌های منتخب
      description: نیازمند مجوز catalog.write است. قیمت‌ها برحسب تومان هستند.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BestSellingProductCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/AdminBestSellingItemSuccess'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /admin/best-selling-products/{itemId}:
    patch:
      tags: [product]
      operationId: adminUpdateBestSellingProduct
      summary: ویرایش کتاب پرفروش منتخب
      description: نیازمند مجوز catalog.write است. فقط فیلدهای ارسال‌شده تغییر می‌کنند.
      parameters:
        - {$ref: '#/components/parameters/BestSellingItemId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BestSellingProductUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/AdminBestSellingItemSuccess'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      tags: [product]
      operationId: adminDeleteBestSellingProduct
      summary: حذف کتاب از پرفروش‌های منتخب
      description: نیازمند مجوز catalog.write است.
      parameters:
        - {$ref: '#/components/parameters/BestSellingItemId'}
      responses:
        '204': {description: کتاب از فهرست پرفروش‌ها حذف شد.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /admin/skus/{skuId}/pricing-tiers:
    get: {tags: [Phase 4 / Catalog Admin], parameters: [{name: skuId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    put: {tags: [Phase 4 / Catalog Admin], parameters: [{name: skuId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/inventory/adjustments:
    post: {tags: [Phase 4 / Catalog Admin], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /admin/coupons:
    get: {tags: [Phase 4 / Configuration], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {tags: [Phase 4 / Configuration], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /admin/coupons/{couponId}:
    patch: {tags: [Phase 4 / Configuration], parameters: [{name: couponId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/settings/{setting}:
    get: {tags: [Phase 4 / Configuration], parameters: [{name: setting, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    put: {tags: [Phase 4 / Configuration], parameters: [{name: setting, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  headers:
    RequestId:
      description: شناسه Trace نهایی درخواست
      schema: {type: string}
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: شناسه Trace کلاینت؛ در صورت نامعتبر بودن سرور شناسه جدید می‌سازد.
      schema: {type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$'}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 60}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 60}}
    BestSellingItemId:
      name: itemId
      in: path
      required: true
      description: شناسه آیتم پرفروش
      schema: {type: string, pattern: '^bsp_[a-z0-9]+$', example: bsp_01k5example}
    GuestCartToken:
      name: X-Guest-Cart-Token
      in: header
      required: false
      description: توکن دریافت‌شده از POST /carts برای سبد مهمان
      schema: {type: string}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
  requestBodies: {Json: {required: true, content: {application/json: {schema: {type: object}}}}}
  schemas:
    Meta: {type: object, required: [requestId, serverTime], properties: {requestId: {type: string}, serverTime: {type: string, format: date-time}}}
    Success: {type: object, required: [data, meta], properties: {data: {}, meta: {$ref: '#/components/schemas/Meta'}}}
    Error: {type: object, required: [error, meta], properties: {error: {type: object, required: [code,message,fields,details], properties: {code: {type: string}, message: {type: string}, fields: {type: object}, details: {type: object}}}, meta: {$ref: '#/components/schemas/Meta'}}}
    PricingQuoteLineRequest:
      type: object
      required: [skuId, quantity]
      properties:
        skuId: {type: string, example: sku_ff3_sb_2e}
        quantity: {type: integer, minimum: 1, example: 10}
    CartItemRequest:
      type: object
      required: [skuId, quantity]
      properties:
        skuId: {type: string, example: sku_ff3_sb_2e}
        quantity: {type: integer, minimum: 1, example: 5}
    Cover:
      type: [object, 'null']
      properties:
        url: {type: string, format: uri}
        alt: {type: string}
    ProductSummary:
      type: object
      required: [id, slug, title, cover, defaultSku]
      properties:
        id: {type: string}
        slug: {type: string}
        title: {type: string}
        subtitle: {type: [string, 'null']}
        series: {type: [object, 'null']}
        publisher: {type: [object, 'null']}
        cover: {$ref: '#/components/schemas/Cover'}
        defaultSku:
          type: [object, 'null']
          properties:
            id: {type: string}
            attributes: {type: object}
            minimumQuantity: {type: integer}
            startingUnitPrice: {type: integer}
            referenceUnitPrice: {type: integer}
            availableQuantity: {type: integer}
            availability: {type: string}
            fastDispatch: {type: boolean}
    BestSellingProduct:
      type: object
      required: [id, title, coverUrl, coverAlt, price, discountedPrice, discountPercent, remainingPercent]
      properties:
        id: {type: string, example: bsp_01k5example}
        title: {type: string, maxLength: 250, example: Family and Friends 3}
        coverUrl: {type: string, example: 'https://cdn.example.com/books/family-3.jpg'}
        coverAlt: {type: [string, 'null'], maxLength: 250, example: جلد کتاب Family and Friends 3}
        price: {type: integer, minimum: 1, example: 250000, description: قیمت اصلی برحسب تومان}
        discountedPrice: {type: integer, minimum: 0, example: 200000, description: قیمت پس از تخفیف برحسب تومان؛ نباید از قیمت اصلی بیشتر باشد.}
        discountPercent: {type: integer, minimum: 0, maximum: 100, example: 20}
        remainingPercent: {type: integer, minimum: 0, maximum: 100, example: 35}
    AdminBestSellingProduct:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/BestSellingProduct'}
        - type: object
          required: [sortOrder, active]
          properties:
            sortOrder: {type: integer, minimum: 0, maximum: 100000, example: 1}
            active: {type: boolean, example: true}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    BestSellingProductCreateRequest:
      type: object
      additionalProperties: false
      required: [title, coverUrl, price, discountedPrice, discountPercent, remainingPercent]
      properties:
        title: {type: string, minLength: 1, maxLength: 250, example: Family and Friends 3}
        coverUrl: {type: string, minLength: 1, example: 'https://cdn.example.com/books/family-3.jpg'}
        coverAlt: {type: [string, 'null'], maxLength: 250, example: جلد کتاب Family and Friends 3}
        price: {type: integer, minimum: 1, example: 250000}
        discountedPrice: {type: integer, minimum: 0, example: 200000}
        discountPercent: {type: integer, minimum: 0, maximum: 100, example: 20}
        remainingPercent: {type: integer, minimum: 0, maximum: 100, example: 35}
        sortOrder: {type: integer, minimum: 0, maximum: 100000, default: 0, example: 1}
        active: {type: boolean, default: true, example: true}
    BestSellingProductUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 250}
        coverUrl: {type: string, minLength: 1}
        coverAlt: {type: [string, 'null'], maxLength: 250}
        price: {type: integer, minimum: 1}
        discountedPrice: {type: integer, minimum: 0}
        discountPercent: {type: integer, minimum: 0, maximum: 100}
        remainingPercent: {type: integer, minimum: 0, maximum: 100}
        sortOrder: {type: integer, minimum: 0, maximum: 100000}
        active: {type: boolean}
    Home:
      type: object
      required: [hero, benefits, featuredSeries, bestSelling, fastDispatch, wholesaleSteps, contact]
      properties:
        hero: {type: object}
        benefits: {type: array, items: {type: object}}
        featuredSeries: {type: array, items: {type: object}}
        bestSelling: {type: array, items: {$ref: '#/components/schemas/BestSellingProduct'}}
        fastDispatch: {type: array, items: {$ref: '#/components/schemas/ProductSummary'}}
        wholesaleSteps: {type: array, items: {type: object}}
        contact: {type: object}
    HealthLive:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    HealthReady:
      type: object
      required: [status, database]
      properties:
        status: {type: string, const: ready}
        database: {type: string, const: ok}
    Bootstrap:
      type: object
      required: [currency, locale, features]
      properties:
        currency: {type: string, const: TOMAN}
        locale: {type: string, const: fa-IR}
        features:
          type: object
          required: [guestCart, onlinePayment]
          properties:
            guestCart: {type: boolean}
            onlinePayment: {type: boolean}
  responses:
    Success: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/Success'}}}}
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ProductCollectionSuccess:
      description: Product collection
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Success'}
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ProductSummary'}}}}
    BestSellingCollectionSuccess:
      description: فهرست عمومی کتاب‌های پرفروش
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Success'}
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/BestSellingProduct'}}}}
    AdminBestSellingCollectionSuccess:
      description: فهرست مدیریتی کتاب‌های پرفروش
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Success'}
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/AdminBestSellingProduct'}}}}
    AdminBestSellingItemSuccess:
      description: اطلاعات آیتم پرفروش ایجاد یا ویرایش‌شده
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Success'}
              - {type: object, properties: {data: {$ref: '#/components/schemas/AdminBestSellingProduct'}}}
    HomeSuccess:
      description: Home aggregate
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Success'}
              - {type: object, properties: {data: {$ref: '#/components/schemas/Home'}}}
    HealthLiveSuccess:
      description: پردازش API زنده است.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Success'}
              - {type: object, properties: {data: {$ref: '#/components/schemas/HealthLive'}}}
    HealthReadySuccess:
      description: API و دیتابیس آماده پاسخ‌گویی هستند.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Success'}
              - {type: object, properties: {data: {$ref: '#/components/schemas/HealthReady'}}}
    BootstrapSuccess:
      description: تنظیمات عمومی لازم برای شروع کلاینت
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Success'}
              - {type: object, properties: {data: {$ref: '#/components/schemas/Bootstrap'}}}
